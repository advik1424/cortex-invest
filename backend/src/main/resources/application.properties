server.port=8080
spring.application.name=cortex-invest

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:cortexdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent


# File upload limits for chart screenshots
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
